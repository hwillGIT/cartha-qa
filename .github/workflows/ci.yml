# Thin CI: Loop 1 — deterministic baseline smoke. All logic lives in the
# harness CLI; this file only declares what runs, when, and on which runner.
name: Deterministic smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"  # nightly, UTC
  workflow_dispatch:
    inputs:
      seed:
        description: "Master seed (default: run date)"
        required: false
        default: ""
      ref:
        description: "Branch, tag, or commit SHA to test (default: main)"
        required: false
        default: "main"

env:
  HARNESS_SEED: ${{ github.event.inputs.seed || format('{0}-nightly', github.run_id) }}

jobs:
  smoke:
    runs-on: [self-hosted, macOS, ARM64]  # mobile needs the Mac runner
    timeout-minutes: 60
    steps:
      - name: Check repo access token
        run: |
          if [ -z "${{ secrets.CARTHA_REPO_SECRET }}" ]; then
            echo "CARTHA_REPO_SECRET is not set."
            echo "Create a fine-grained PAT with read access to zackseyun/cartha.ai.mobile,"
            echo "zackseyun/cartha.website, zackseyun/CarthaCdkService, and add it as a"
            echo "repository secret named CARTHA_REPO_SECRET on hwillGIT/cartha-qa."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          path: cartha-qa
      # App repos are private; CARTHA_REPO_SECRET is a fine-grained PAT with
      # read access to zackseyun/cartha.ai.mobile, cartha.website, CarthaCdkService.
      - uses: actions/checkout@v4
        with:
          repository: zackseyun/cartha.ai.mobile
          token: ${{ secrets.CARTHA_REPO_SECRET }}
          path: cartha.ai.mobile
          ref: ${{ github.event.inputs.ref || 'main' }}
      - uses: actions/checkout@v4
        with:
          repository: zackseyun/cartha.website
          token: ${{ secrets.CARTHA_REPO_SECRET }}
          path: cartha.website
          ref: ${{ github.event.inputs.ref || 'main' }}
      - name: Add toolchain to PATH
        run: |
          # mini uses ~/dev, macbook uses ~/toolchain (+ brew for node/go)
          for d in "$HOME/dev/flutter/bin" "$HOME/toolchain/flutter/bin" \
                   "$HOME/dev/node/bin" "$HOME/toolchain/node/bin" \
                   "$HOME/.maestro/bin" \
                   "$HOME/dev/go/bin" "$HOME/toolchain/go/bin" \
                   "$HOME/dev/java/Contents/Home/bin" "$HOME/toolchain/java/Contents/Home/bin" \
                   /opt/homebrew/bin; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done
          if [ -d "$HOME/dev/java/Contents/Home" ]; then
            echo "JAVA_HOME=$HOME/dev/java/Contents/Home" >> "$GITHUB_ENV"
          else
            echo "JAVA_HOME=$HOME/toolchain/java/Contents/Home" >> "$GITHUB_ENV"
          fi
      - name: Install harness CLI
        run: |
          python3 -m venv "$RUNNER_TEMP/harness-venv"
          "$RUNNER_TEMP/harness-venv/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/harness-venv/bin/pip" install ./cartha-qa/harness
          echo "$RUNNER_TEMP/harness-venv/bin" >> "$GITHUB_PATH"
      - name: Detect machine and simulator
        id: machine
        run: |
          HOST=$(hostname)
          echo "Hostname: $HOST"
          if [[ "$HOST" == *"MacBook"* ]]; then
            echo "sim_udid=B69B528D-87BD-4897-AA0D-CFB8DBEC6073" >> $GITHUB_OUTPUT
            echo "machine=macbook" >> $GITHUB_OUTPUT
            echo "Using MacBook iPhone 17 simulator"
          else
            echo "sim_udid=56CFEE56-2C47-4D93-BD95-E5E11FC6251C" >> $GITHUB_OUTPUT
            echo "machine=mini" >> $GITHUB_OUTPUT
            echo "Using Mac mini iPhone 17 simulator"
          fi
      - name: Apply iOS test patches
        run: |
          bash ./cartha-qa/ios-patches/apply-ios-patches.sh "$GITHUB_WORKSPACE/cartha.ai.mobile/cartha_ai_mobile"
      - name: Get Flutter dependencies
        run: |
          cd cartha.ai.mobile/cartha_ai_mobile
          flutter pub get
      - name: Patch flutter_contacts for scenes
        run: |
          bash ./cartha-qa/ios-patches/patch-flutter-contacts.sh
      - name: Build iOS simulator app
        run: |
          cd cartha.ai.mobile/cartha_ai_mobile
          mkdir -p build/ios_cloud_project_stage
          mv ios/*Cloud.xcodeproj build/ios_cloud_project_stage/ 2>/dev/null || true
          flutter build ios --simulator > /tmp/build.log 2>&1 || BUILD_FAILED=1
          mv build/ios_cloud_project_stage/*Cloud.xcodeproj ios/ 2>/dev/null || true
          tail -50 /tmp/build.log || true
          if [ "${BUILD_FAILED:-0}" = "1" ]; then
            echo "Build FAILED"
            exit 1
          fi
          echo "Build complete"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: /tmp/build.log
          retention-days: 7
      - name: Boot simulator and install app
        run: |
          SIM_UDID="${{ steps.machine.outputs.sim_udid }}"
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || echo "Simulator already booted"
          rm -rf /tmp/RunnerNoExt.app
          cp -R cartha.ai.mobile/cartha_ai_mobile/build/ios/iphonesimulator/Runner.app /tmp/RunnerNoExt.app
          rm -rf /tmp/RunnerNoExt.app/PlugIns
          xcrun simctl install "$SIM_UDID" /tmp/RunnerNoExt.app
          echo "Installed on $SIM_UDID"
      - name: Run deterministic smoke
        env:
          SIMULATOR_UDID: ${{ steps.machine.outputs.sim_udid }}
        run: |
          harness run-smoke \
            --seed "$HARNESS_SEED" \
            --manifest cartha-qa/harness/smoke-manifest.yml \
            --quarantine cartha-qa/harness/quarantine.yml \
            --mobile-dir cartha.ai.mobile \
            --web-dir cartha.website \
            --backend-dir cartha-qa \
            --out-manifest run-manifest.json \
            --out-report smoke-report.json
      - name: Upload manifest and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ github.run_id }}
          path: |
            run-manifest.json
            smoke-report.json
