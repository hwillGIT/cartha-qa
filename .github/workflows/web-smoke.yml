name: Web Smoke Test

# Runs Cartha web smoke tests on the MacBook self-hosted runner.
# Uses Playwright with Chromium to verify the web app loads and key flows work.
#
# Required secrets:
#   CARTHA_REPO_SECRET: GitHub PAT with read access to zackseyun/cartha.website

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Website repo ref (branch, tag, or SHA)'
        required: false
        default: 'main'
  push:
    branches: [main]
    paths:
      - '.github/workflows/web-smoke.yml'

jobs:
  web-smoke:
    # Runs on either Mac; the first step verifies it's the MacBook (Playwright).
    # Both runners share labels, so we detect the machine at runtime.
    # (Mac mini is offline; ignored for now.)
    runs-on: [self-hosted, macOS, ARM64]
    
    steps:
      - name: Check if MacBook
        id: check
        run: |
          HOST=$(hostname)
          echo "Hostname: $HOST"
          if [[ "$HOST" == *"MacBook"* ]]; then
            echo "is_macbook=true" >> $GITHUB_OUTPUT
            echo "Running on MacBook, proceeding with web tests"
          else
            echo "is_macbook=false" >> $GITHUB_OUTPUT
            echo "Not the MacBook. Skipping web tests."
          fi
      
      - name: Check out harness
        if: steps.check.outputs.is_macbook == 'true'
        uses: actions/checkout@v4
      
      - name: Check out website repo
        if: steps.check.outputs.is_macbook == 'true'
        uses: actions/checkout@v4
        with:
          repository: zackseyun/cartha.website
          ref: ${{ inputs.ref || 'main' }}
          path: cartha.website
          token: ${{ secrets.CARTHA_REPO_SECRET }}
      
      - name: Set up Node
        if: steps.check.outputs.is_macbook == 'true'
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          node --version
          npm --version
      
      - name: Install dependencies
        if: steps.check.outputs.is_macbook == 'true'
        run: |
          cd cartha.website
          npm ci
      
      - name: Verify Playwright Chromium
        if: steps.check.outputs.is_macbook == 'true'
        run: |
          cd cartha.website
          npx playwright install chromium --dry-run 2>&1 | head -5 || true
          # Chromium should already be installed; verify it launches
          node -e "
            const { chromium } = require('playwright');
            (async () => {
              const b = await chromium.launch({ headless: true });
              console.log('Chromium OK');
              await b.close();
            })();
          "
      
      - name: Run web smoke tests
        if: steps.check.outputs.is_macbook == 'true'
        run: |
          cd cartha.website
          # Run the smoke-tier Playwright tests from the manifest
          # TODO: Integrate with harness/smoke-manifest.yml for full list
          npx playwright test --list 2>&1 | head -20
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: cartha.website/playwright-report/
          retention-days: 7
