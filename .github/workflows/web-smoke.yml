name: Web Smoke Test

# Runs Cartha web smoke tests on the MacBook self-hosted runner.
# Uses Playwright with Chromium to verify the web app loads and key flows work.
#
# Required secrets:
#   CARTHA_REPO_SECRET: GitHub PAT with read access to zackseyun/cartha.website

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Website repo ref (branch, tag, or SHA)'
        required: false
        default: 'main'
  push:
    branches: [main]
    paths:
      - '.github/workflows/web-smoke.yml'

jobs:
  web-smoke:
    runs-on: [self-hosted, macOS, ARM64, macbook-qa]
    timeout-minutes: 45
    
    steps:
      - name: Check out harness
        uses: actions/checkout@v4
      
      - name: Check out website repo
        uses: actions/checkout@v4
        with:
          repository: zackseyun/cartha.website
          ref: ${{ inputs.ref || 'main' }}
          path: cartha.website
          token: ${{ secrets.CARTHA_REPO_SECRET }}
      
      - name: Set up Node
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          node --version
          npm --version
      
      - name: Install dependencies
        run: |
          cd cartha.website
          npm ci
          npm install --no-save --package-lock=false playwright@1.63.0
      
      - name: Verify Chrome browser automation
        run: |
          cd cartha.website
          node -e "
            const { chromium } = require('playwright');
            (async () => {
              const b = await chromium.launch({ headless: true, channel: 'chrome' });
              console.log('Chrome OK');
              await b.close();
            })();
          "
      - name: Install harness CLI
        run: |
          python3 -m venv "$RUNNER_TEMP/harness-venv"
          "$RUNNER_TEMP/harness-venv/bin/pip" install --quiet ./harness
          echo "$RUNNER_TEMP/harness-venv/bin" >> "$GITHUB_PATH"
      - name: Run web smoke tests
        run: |
          harness run-smoke \
            --seed "web-${{ github.run_id }}" \
            --manifest harness/smoke-manifest.yml \
            --quarantine harness/quarantine.yml \
            --kinds node,playwright \
            --mobile-dir cartha.ai.mobile \
            --web-dir cartha.website \
            --backend-dir . \
            --out-manifest web-run-manifest.json \
            --out-report web-smoke-report.json
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-${{ github.run_id }}
          path: |
            web-run-manifest.json
            web-smoke-report.json
            cartha.website/tmp/download-promo-qa/
          retention-days: 7
