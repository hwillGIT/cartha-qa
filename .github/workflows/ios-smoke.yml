name: iOS Smoke Test

# Runs the Cartha iOS smoke test on the MacBook self-hosted runner. The shared
# preparation script handles the installed Xcode version and selects an
# available iPhone simulator.
#
# Required secrets:
#   CARTHA_REPO_SECRET: GitHub PAT with read access to zackseyun/cartha.ai.mobile
#
# The patches in ios-patches/ are test-only and must not be committed to
# zackseyun/cartha.ai.mobile.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Mobile repo ref (branch, tag, or SHA)'
        required: false
        default: 'main'
      maestro_flow:
        description: 'Optional mobile flow (blank runs the current QA launch smoke)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'ios-patches/**'
      - '.github/workflows/ios-smoke.yml'

jobs:
  ios-smoke:
    runs-on: [self-hosted, macOS, ARM64, macbook-qa]
    timeout-minutes: 90
    steps:
      - name: Check out harness
        uses: actions/checkout@v4
      - name: Check out mobile repo
        uses: actions/checkout@v4
        with:
          repository: zackseyun/cartha.ai.mobile
          ref: ${{ inputs.ref || 'main' }}
          path: cartha.ai.mobile
          token: ${{ secrets.CARTHA_REPO_SECRET }}
      - name: Set up toolchain PATH
        run: |
          for d in /opt/homebrew/bin "$HOME/.cargo/bin" "$HOME/.maestro/bin" \
                   "$HOME/dev/flutter/bin" "$HOME/toolchain/flutter/bin" \
                   "$HOME/dev/java/Contents/Home/bin" "$HOME/toolchain/java/Contents/Home/bin"; do
            [ ! -d "$d" ] || echo "$d" >> "$GITHUB_PATH"
          done
          command -v xcodebuild
      - name: Verify mobile ref
        run: |
          git -C cartha.ai.mobile rev-parse HEAD
      - name: Build and install on iPhone simulator
        run: ./ios-patches/build-and-install-simulator.sh "$GITHUB_WORKSPACE/cartha.ai.mobile/cartha_ai_mobile"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/cartha-ios-build.log
          retention-days: 7
      - name: Dismiss optional first-run tutorial
        run: maestro test --device "$SIMULATOR_UDID" harness/maestro/prepare-first-run.yaml
      - name: Run Maestro flow
        working-directory: cartha.ai.mobile
        env:
          MAESTRO_FLOW: ${{ inputs.maestro_flow }}
        run: |
          if [ -z "$MAESTRO_FLOW" ]; then
            MAESTRO_FLOW="$GITHUB_WORKSPACE/harness/maestro/launch-fellowship.yaml"
          fi
          maestro test --device "$SIMULATOR_UDID" "$MAESTRO_FLOW"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots
          path: ~/.maestro/tests/
          retention-days: 7
