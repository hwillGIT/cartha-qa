# Test setup only: clear the optional first-install tutorial so smoke flows
# start from the app shell. The application tests themselves remain unchanged.
appId: com.cartha.app
---
- launchApp
- repeat:
    while:
      visible: "Open in.*"
    times: 4
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd:
          timeout: 3000
- waitForAnimationToEnd:
    timeout: 15000
- runFlow:
    when:
      visible: "Skip tour"
    commands:
      - tapOn: "Skip tour"
      - waitForAnimationToEnd
