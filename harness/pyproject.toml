[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cartha-harness"
version = "0.1.0"
description = "Deterministic test harness CLI for Cartha's mobile, web, and desktop apps."
requires-python = ">=3.9"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
explore = ["langchain>=0.3"]
test = ["pytest>=8"]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
